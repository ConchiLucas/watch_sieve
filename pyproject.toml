[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "watch_sieve"
version = "0.1.0"
description = "Watch specified sites and stably fetch page content."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "lxml>=5.3",
    "cssselect>=1.2",
    "html2text>=2024.2",
    "charset-normalizer>=3.4",
    "playwright>=1.49",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
snailjob = ["snail-job-python>=0.1.3,<0.2"]

[project.scripts]
watch-sieve = "watch_sieve.__main__:main"
watch-sieve-web = "watch_sieve.server:run"
watch-sieve-snailjob = "watch_sieve.snailjob_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
